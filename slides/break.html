<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הפסקה · Claude Code for Everyone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="day1.css">
<style>
  #nav,#progress{display:none!important}
  .break-wrap{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:space-between;gap:40px}
  .break-text{flex:1;display:flex;flex-direction:column;align-items:flex-start;text-align:right;margin-top:96px}
  .break-text h1{font-size:88px;line-height:1.05;margin:0;font-weight:800;color:var(--ink)}
  .break-text .sub{font-size:30px;color:var(--muted);margin:4px 0 0;font-weight:500;font-style:normal}
  .dial{position:relative;width:340px;height:340px;margin:10px 0 14px}
  .dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg) scaleY(-1)}
  .dial .track{fill:none;stroke:rgba(12,27,58,.10);stroke-width:16}
  .dial .bar{fill:none;stroke:var(--orange);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
  .dial .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:ltr}
  .dial .digits{font-size:84px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1}
  .dial .state{font-size:26px;color:var(--muted);margin-top:10px;direction:rtl;font-weight:500}
  .controls{display:flex;gap:12px;align-items:center;direction:rtl;flex-wrap:nowrap;justify-content:flex-start}
  .btn{display:inline-flex;align-items:center;gap:12px;padding:8px 20px;border-radius:999px;border:3px solid var(--ink);background:#fff;color:var(--ink);font:700 22px var(--sans);cursor:pointer;box-shadow:0 6px 18px rgba(12,27,58,.12)}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
  .btn:hover{filter:brightness(1.05)}
  .btn.on{background:var(--ink);color:#fff}
  .vol{display:flex;align-items:center;gap:10px;font-size:22px;color:var(--muted)}
  .vol input{width:110px;accent-color:var(--orange)}
  .done .digits{color:var(--orange)}
  .hint{margin-top:16px;font-size:24px;color:var(--muted)}
  .break-wrap .cc-mascot{margin-bottom:40px}
</style>
</head>
<body data-start="1" data-total="1" data-lesson="1">

<div id="stage">
<section class="slide cover-bg nofoot active" data-mod="1" id="slide">
  <div class="cover-art" data-flip="0"></div>
  <div class="cover-logos"><img src="../assets/technion-logo.png" alt="הטכניון, מכון טכנולוגי לישראל"><span class="sep"></span><img class="aid" src="../assets/ai-days-logo.png" alt="ימי AI בטכניון"></div>

  <div class="break-wrap">
    <div class="break-text">
      <h1>הפסקה ☕</h1>
      <p class="sub">שותים, מתמתחים, וחוזרים בעוד 10 דקות</p>
      <div class="dial" id="dial">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="90"/>
          <circle class="bar" id="bar" cx="100" cy="100" r="90" stroke-dasharray="565.49" stroke-dashoffset="0"/>
        </svg>
        <div class="time">
          <div class="digits" id="digits">10:00</div>
          <div class="state" id="state">לחצו להתחלה</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn primary" id="go">▶ התחלת הפסקה</button>
        <button class="btn" id="reset">↺ איפוס</button>
        <button class="btn" id="plus">+1 דק׳</button>
        <button class="btn" id="mute" aria-pressed="false">🔊 מוזיקה</button>
        <label class="vol">עוצמה <input type="range" id="vol" min="0" max="100" value="55"></label>
      </div>
    </div>
    <div class="cc-mascot" data-say="זמן לקפה ☕|מתמתחים קצת?|שותים מים 💧|אני מחכה לכם כאן|עוד מעט ממשיכים!"></div>
  </div>
</section>
<div id="progress"></div>
</div><!-- /stage -->

<div id="nav"><button id="prev">→</button><button id="fs">⛶</button><button id="next">←</button></div>

<script src="day1.js"></script>
<script>
(function(){
  const TOTAL=10*60;
  let left=TOTAL, running=false, tick=null, endAt=0;
  const $=id=>document.getElementById(id);
  const digits=$('digits'), state=$('state'), bar=$('bar'), go=$('go'), dial=$('dial');
  const C=2*Math.PI*90;
  let total=TOTAL;

  function fmt(s){const m=Math.floor(s/60),r=s%60;return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}
  function render(){
    digits.textContent=fmt(left);
    bar.style.strokeDashoffset=String(C*(1-left/total));
    document.title=(running?fmt(left)+' · ':'')+'הפסקה · Claude Code for Everyone';
  }

  // ---------- gentle ambient music, generated in the browser (no files) ----------
  let ctx=null, master=null, userVol=.55, muted=false, musicOn=false, sched=null, nextChord=0, chordIdx=0, nextBell=0;
  const N=(m)=>440*Math.pow(2,(m-69)/12);
  const CHORDS=[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,64]]; // Cmaj7, Am7, Fmaj7, G6
  const PENTA=[72,74,76,79,81,84];
  function setupAudio(){
    if(ctx)return;
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800; lp.Q.value=.3;
    // soft echo "room"
    const d1=ctx.createDelay(1.5), d2=ctx.createDelay(1.5), fb=ctx.createGain(), wet=ctx.createGain();
    d1.delayTime.value=.37; d2.delayTime.value=.59; fb.gain.value=.45; wet.gain.value=.5;
    lp.connect(master); lp.connect(d1); lp.connect(d2); d1.connect(fb); d2.connect(fb); fb.connect(d1); fb.connect(d2);
    d1.connect(wet); d2.connect(wet); wet.connect(master);
    master.connect(ctx.destination);
    ctx._in=lp;
  }
  function pad(notes,t,dur){
    notes.forEach((n,i)=>{
      [-4,4].forEach(det=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type=i<2?'sine':'triangle'; o.frequency.value=N(n); o.detune.value=det;
        const peak=.05/(1+i*.3);
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(peak,t+dur*.4);
        g.gain.linearRampToValueAtTime(0,t+dur+2.5);
        o.connect(g); g.connect(ctx._in); o.start(t); o.stop(t+dur+2.6);
      });
    });
  }
  function bell(m,t){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=N(m);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.07,t+.02); g.gain.exponentialRampToValueAtTime(.0008,t+3.2);
    o.connect(g); g.connect(ctx._in); o.start(t); o.stop(t+3.3);
  }
  function scheduler(){
    const now=ctx.currentTime;
    while(nextChord<now+1){
      pad(CHORDS[chordIdx%CHORDS.length],nextChord,8); chordIdx++; nextChord+=8;
    }
    while(nextBell<now+1){
      bell(PENTA[Math.floor(Math.random()*PENTA.length)],nextBell);
      nextBell+=1.6+Math.random()*2.6;
    }
  }
  function applyVol(sec){
    if(!ctx)return;
    const v=(musicOn&&!muted)?userVol*.9:0;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(v,ctx.currentTime,sec||.4);
  }
  function startMusic(){
    setupAudio(); ctx.resume();
    if(musicOn)return;
    musicOn=true; nextChord=nextBell=ctx.currentTime+.1;
    scheduler(); sched=setInterval(scheduler,400);
    master.gain.setValueAtTime(0,ctx.currentTime); applyVol(2.5); // slow fade-in
  }
  function stopMusic(fade){
    if(!ctx||!musicOn)return;
    musicOn=false; applyVol(fade||1.5);
    setTimeout(()=>{if(!musicOn)clearInterval(sched)},(fade||1.5)*3000);
  }
  function chime(){
    if(!ctx)return; const t=ctx.currentTime+.05;
    master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(muted?0:userVol*.9,t);
    [76,79,84,88].forEach((m,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=N(m);
      const s=t+i*.35; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.18,s+.03); g.gain.exponentialRampToValueAtTime(.001,s+3);
      o.connect(g); g.connect(ctx._in); o.start(s); o.stop(s+3.1);
    });
  }

  // ---------- timer ----------
  function start(){
    if(left<=0)return;
    running=true; endAt=Date.now()+left*1000;
    go.textContent='⏸ השהיה'; go.classList.remove('primary'); dial.classList.remove('done');
    state.textContent='נחים... מתחילים בעוד';
    startMusic();
    clearInterval(tick);
    tick=setInterval(()=>{
      left=Math.max(0,Math.round((endAt-Date.now())/1000));
      if(left===8&&musicOn)applyVol(5); // gentle fade-out before the end
      render();
      if(left<=0)finish();
    },250);
    render();
  }
  function pause(){
    running=false; clearInterval(tick);
    go.textContent='▶ המשך'; go.classList.add('primary'); state.textContent='בהשהיה';
    stopMusic(1.2); render();
  }
  function finish(){
    running=false; clearInterval(tick);
    stopMusic(1); setTimeout(chime,300);
    go.textContent='▶ שוב'; go.classList.add('primary');
    state.textContent='חוזרים! 🎉'; dial.classList.add('done');
    document.title='חוזרים! · Claude Code for Everyone'; render();
    setTimeout(()=>{if(!running)left=0},0);
  }
  go.onclick=()=>{
    if(running){pause();return}
    if(left<=0){left=total=TOTAL;}
    start();
  };
  $('reset').onclick=()=>{
    running=false; clearInterval(tick); left=total=TOTAL; stopMusic(1);
    go.textContent='▶ התחלת הפסקה'; go.classList.add('primary'); state.textContent='לחצו להתחלה'; dial.classList.remove('done'); render();
  };
  $('plus').onclick=()=>{
    left+=60; if(left>total)total=left; if(running)endAt+=60000;
    if(dial.classList.contains('done')){dial.classList.remove('done'); state.textContent='לחצו להתחלה'; go.textContent='▶ התחלת הפסקה'}
    render();
  };
  $('mute').onclick=e=>{
    muted=!muted; e.currentTarget.textContent=(muted?'🔇':'🔊')+' מוזיקה';
    e.currentTarget.classList.toggle('on',muted); e.currentTarget.setAttribute('aria-pressed',muted); applyVol(.2);
  };
  $('vol').oninput=e=>{userVol=e.target.value/100; applyVol(.1)};
  addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;
    if(e.code==='Space'){e.preventDefault();go.click()}
    if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  });
  render();
})();
</script>
</body>
</html>
